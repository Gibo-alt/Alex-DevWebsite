<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Technology stack showing software layers on top, electronic layers below, and a shared middle zone"><rect width="1100" height="560" rx="24" fill="#f5efe3"/><text x="60" y="62" font-family="Georgia, serif" font-size="28" fill="#23201b">Where the two disciplines meet</text><rect x="60" y="100" width="680" height="58" rx="12" fill="#fff" stroke="#ddcdae"/><text x="90" y="136" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#23201b">Apps, web &amp; cloud services</text><rect x="60" y="170" width="680" height="58" rx="12" fill="#fff" stroke="#ddcdae"/><text x="90" y="206" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#23201b">Operating systems &amp; runtimes</text><rect x="60" y="240" width="680" height="58" rx="12" fill="#ddcdae" stroke="#ddcdae"/><text x="90" y="276" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#23201b">Firmware &amp; drivers</text><rect x="60" y="310" width="680" height="58" rx="12" fill="#ddcdae" stroke="#ddcdae"/><text x="90" y="346" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#23201b">Embedded systems &amp; FPGAs</text><rect x="60" y="380" width="680" height="58" rx="12" fill="#23201b" stroke="#ddcdae"/><text x="90" y="416" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">Circuits &amp; PCBs</text><rect x="60" y="450" width="680" height="58" rx="12" fill="#23201b" stroke="#ddcdae"/><text x="90" y="486" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">Semiconductors &amp; devices</text><path d="M770 100 q14 0 14 14 V152.0 q0 12 14 12 q-14 0 -14 12 V214 q0 14 -14 14" fill="none" stroke="#c2a878" stroke-width="2.5"/><text x="820" y="160.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#23201b">Software engineering</text><text x="820" y="184.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="14" fill="#7d7466">ship daily · cheap to change</text><path d="M770 240 q14 0 14 14 V292.0 q0 12 14 12 q-14 0 -14 12 V354 q0 14 -14 14" fill="none" stroke="#8f7547" stroke-width="2.5"/><text x="820" y="300.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#23201b">The overlap</text><text x="820" y="324.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="14" fill="#7d7466">C, RTOS, signals, debugging</text><path d="M770 380 q14 0 14 14 V432.0 q0 12 14 12 q-14 0 -14 12 V494 q0 14 -14 14" fill="none" stroke="#23201b" stroke-width="2.5"/><text x="820" y="440.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#23201b">Electronic engineering</text><text x="820" y="464.0" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="14" fill="#7d7466">months per spin · costly to fix</text></svg>