<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 542" width="1100" height="542" role="img" aria-label="Bar chart of AI adoption figures"><rect width="1100" height="542" rx="24" fill="#f5efe3"/><text x="60" y="64" font-family="Georgia, serif" font-size="28" fill="#23201b">AI adoption in numbers</text><text x="60" y="110" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#23201b">Developers using or planning to use AI tools</text><text x="1040" y="110" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#7d7466">Stack Overflow 2025</text><rect x="60" y="122" width="800" height="22" rx="11" fill="#ece2cf"/><rect x="60" y="122" width="672.0" height="22" rx="11" fill="#8f7547"/><text x="876" y="140" font-family="'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#23201b">84%</text><text x="60" y="182" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#23201b">Organisations using AI in at least one function</text><text x="1040" y="182" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#7d7466">McKinsey 2025</text><rect x="60" y="194" width="800" height="22" rx="11" fill="#ece2cf"/><rect x="60" y="194" width="704.0" height="22" rx="11" fill="#8f7547"/><text x="876" y="212" font-family="'JetBrains Mono', Menlo, monospace" font-size="18" font-weight="600" fill="#23201b">88%</text><text x="60" y="254" font-family="Manrope, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#23201b">Share of Google’s new code generated by AI</text><text x="1040" y="254" text-anchor="end" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#7d7466">Google, Apr 2026</text><rect x="60" y="266" width="800" height="22" rx="11" fill="#ece2cf"/><rect x="60" y="266" width="600.0" height="22" rx="11" fill="#8f7547"/><text x="876" y="284" font-family="'JetBrains Mono', Menlo, monosp